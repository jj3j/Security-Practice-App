name: Deploy to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-ec2
  cancel-in-progress: false

jobs:
  ci:
    name: CI gate
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy release
    needs: ci
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build immutable release archive
        run: git archive --format=tar.gz --output=release.tar.gz HEAD

      - name: Configure SSH
        id: ssh
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$EC2_SSH_KEY" || { echo "EC2_SSH_PRIVATE_KEY is not configured" >&2; exit 1; }
          test -n "$EC2_KNOWN_HOSTS" || { echo "EC2_KNOWN_HOSTS is not configured" >&2; exit 1; }
          key_file="$RUNNER_TEMP/gdsa-practice-ssh-key"
          known_hosts_file="$RUNNER_TEMP/gdsa-practice-known-hosts"
          umask 077
          printf '%s\n' "$EC2_SSH_KEY" > "$key_file"
          printf '%s\n' "$EC2_KNOWN_HOSTS" > "$known_hosts_file"
          echo "key_file=$key_file" >> "$GITHUB_OUTPUT"
          echo "known_hosts_file=$known_hosts_file" >> "$GITHUB_OUTPUT"

      - name: Upload and activate release on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_PORT: ${{ secrets.EC2_SSH_PORT }}
          KEY_FILE: ${{ steps.ssh.outputs.key_file }}
          KNOWN_HOSTS_FILE: ${{ steps.ssh.outputs.known_hosts_file }}
          RELEASE_ID: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$EC2_HOST" || { echo "EC2_HOST is not configured" >&2; exit 1; }
          test -n "$EC2_USER" || { echo "EC2_USER is not configured" >&2; exit 1; }
          port="${EC2_SSH_PORT:-22}"
          short_release_id="${RELEASE_ID:0:12}"
          target="${EC2_USER}@${EC2_HOST}"
          remote_archive="/tmp/gdsa-practice-${RELEASE_ID}.tar.gz"
          ssh_options=(
            -i "$KEY_FILE"
            -p "$port"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$KNOWN_HOSTS_FILE"
          )
          scp_options=(
            -i "$KEY_FILE"
            -P "$port"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$KNOWN_HOSTS_FILE"
          )
          scp "${scp_options[@]}" release.tar.gz "$target:$remote_archive"
          ssh "${ssh_options[@]}" "$target" \
            "sudo bash -s -- '$remote_archive' '$short_release_id'" \
            < deploy/scripts/deploy-release.sh

      - name: Remove temporary SSH material
        if: always()
        run: |
          rm -f -- "${{ steps.ssh.outputs.key_file }}" "${{ steps.ssh.outputs.known_hosts_file }}" release.tar.gz
